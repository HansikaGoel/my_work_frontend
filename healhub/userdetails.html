<!DOCTYPE html>
<html lang="en">
<head>
  <title>DETAILS</title>
  <link rel="stylesheet" href="userdetails.css">
</head>
<body <!-- style="background-color: black;" -->>
  <h1> 
    <u>YOUR PROFILE</u>
  </h1>
  <form>
   <lable for= first name >What is your first name?</lable>
   <input type="text" placeholder="Enter first name" id="firstname" class="detail" required/>
   <br>
   <br>
   <lable for= middle name>What is your middle name?</lable>
   <input type="text" placeholder="Enter middle name" id="middlename" class="detail"/>
   <br>
   <br>
   <lable for= last name>What is your last name?</lable>
   <input type="text" placeholder="Enter last name" id="lastname" class="detail" required/>
   <br>
   <br>
   <lable for= contact number>Your contact number?</lable>
   <input type=" contact number" placeholder="Enter contact number" id="cn" class="detail" required/>
   <br>
   <br>
   <lable for= email>Your email id? </lable>
   <input type="email" placeholder="Enter email" id="email" class="detail" required/>
   <br>
   <br>
   <lable for= birthday>What is your date of birth? </lable>
   <input type="date" placeholder="Enter date of birth" id="date" class="detail" required/>
   <br> 
   <br>
   <lable for= gender>What is your gender?</lable>
   <input type="text" placeholder="Enter gender" id="name" class="detail" required/>
   <br>
   <br>
   <lable for= f\fcontact number>family/ friend contact number?</lable> 
   <input type="contact number" placeholder="Enter close friend/family contact number" id=" f/fcn" class="detail" required/>
   <br>
   <br>
   <lable for= yourself>write about yourself?</lable>
   <input type="textarea" rows ="10" cols="40" placeholder="10 lines about yourself" id="lines" class="detail" required></textarea>
   <br>
   <br>   
   <input type="Submit" class="submit" value="SUBMIT"/>
</form>
</body>
</html>
