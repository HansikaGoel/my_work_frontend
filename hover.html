<!doctype html>
<html lang="en">
  <head>
    <title>hover</title>
    <style>
      .pseudo {
        height: 25px;
        width: 500px;
        color: red;
        background-color: black;
        transition-property: red;
        transition-duration: 0s;
        transition-timing-function: ease-in-out;
        transition-delay: 0s;
      }
      .pseudo:hover {
        height: 40px;
        width: 500px;
        color: black;
        background-color: red;
      }
      .pseudo:active {
        height: 30px;
        width: 500px;
        background-color: chartreuse;
      }
    </style>
  </head>
  <body>
    <h1>ABOUT ME:</h1>
    <pre class="pseudo">
I am Hansika Goel. I am a software engineer and cybersecurity expert.</pre
    >
  </body>
</html>
