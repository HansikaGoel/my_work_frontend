<html lang="en">

    <script>
      let x = 5;
      let y = x;
      console.log(`x= ${x}`);
      console.log(`y= ${y}`);
      x = 3;
      console.log(`x= ${x}`);
      console.log(`y=${y}`);
      let a = { num: 5 };
      let b = a;
      console.log(`a= ${a.num}`);
      console.log(`b= ${b.num}`);
      x = { num: 3 };
      console.log(`a= ${a.num}`);
      console.log(`b= ${b.num}`);
    </script>
  </body>
