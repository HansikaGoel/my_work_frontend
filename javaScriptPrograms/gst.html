<!doctype html>
<html lang="en">
  <head>
    <title>Document</title>
  </head>
  <body>
    <p id="total_amount"></p>
    <p id="a"></p>
    <p id="b"></p>

    <script>
      const gst = 18;
      let total_amount = ((2550 + 500 + 1000) * gst) / 100;
      document.querySelector("#total_amount").innerText =
        `Total Amount is ${total_amount} and GST is ${gst}%`;
      console.log(total_amount);

      console.log(`5+3+2+4*4`);
      console.log(eval(`5+3+2+4*4`));
      console.log(`5+3+2+4*4` + 45);
      console.log(eval(`5+3+2+4*4` + 45));

      //also

      let a = `5+3+2+4*4`;
      document.querySelector("#a").innerText = `${a}`;

      let b = eval(`5+3+2+4*4`);
      document.querySelector("#b").innerText = `${b}`;
    </script>
  </body>
</html>
